<p style="font-size: 15px"
   data-en="The first Jardins de Saló were presented at the Bernheim-Jeune galleries in Paris in 1927, receiving immediate international recognition. The exhibition included the three collaborators' garden models alongside seven tapestries by Dufy printed at the Bianchini Férier factory. The following year the works travelled to London and Belgium; by 1929 they had reached New York."
   data-es="Los primeros jardines de salón se presentaron en las galerías Bernheim-Jeune de París en 1927, recibiendo un reconocimiento internacional inmediato. La exposición incluía las maquetas de jardín de los tres colaboradores junto a siete tapices de Dufy estampados en la fábrica Bianchini Férier. Al año siguiente las obras viajaron a Londres y Bélgica; en 1929 ya habían llegado a Nueva York."
   data-ca="Els primers jardins de saló es van presentar a les galeries Bernheim-Jeune de París el 1927, rebent un reconeixement internacional immediat. L’exposició incloïa els models de jardí dels tres col·laboradors juntament amb set tapissos de Dufy estampats a la fàbrica Bianchini Férier. L’any següent les obres van viatjar a Londres i Bèlgica; el 1929 ja havien arribat a Nova York.">
</p>

<p style="font-size: 15px"
   data-en="The pieces were celebrated for establishing a new language in garden design — one that reconciled the decorative traditions of Art Nouveau with the chromatic liberation of Fauvism, and placed the Mediterranean garden at the centre of international avant-garde discourse."
   data-es="Las piezas fueron celebradas por establecer un nuevo lenguaje en el diseño de jardines — uno que conciliaba las tradiciones decorativas del Art Nouveau con la liberación cromática del fauvismo, y situaba el jardín mediterráneo en el centro del discurso de la vanguardia internacional."
   data-ca="Les peces van ser celebrades per establir un nou llenguatge en el disseny de jardins — un que conciliava les tradicions decoratives de l’Art Nouveau amb l’alliberament cromàtic del fauvisme, i situava el jardí mediterrani al centre del discurs de l’avantguarda internacional.">
</p>

<p style="font-size: 15px; font-style: italic; font-weight: 600"
   data-en="To give the imaginative the pleasures of the garden, something real on which to rest their dreams, I imagined tiny ceramic gardens, decorated by Raoul Dufy and fired by Josep Llorens Artigas."
   data-es="Para ofrecer a los imaginativos los placeres del jardín, algo real sobre lo que apoyar sus sueños, imaginé pequeños jardines cerámicos, decorados por Raoul Dufy y cocidos por Josep Llorens Artigas."
   data-ca="Per oferir als imaginatius els plaers del jardí, una cosa real sobre la qual fer reposar els seus somnis, vaig imaginar petits jardins ceràmics, decorats per Raoul Dufy i cuits per Josep Llorens Artigas.">
</p>

<p style="font-size: 15px"
   data-en="The exhibition establishes a dialogue across a century: fifteen ceramic garden models — one original from 1927, fourteen new works by internationally recognised architects and landscape architects — installed throughout the Barcelona Botanical Garden on Montjuïc mountain. Together they trace the evolution of the garden as a form of urban thought: from the intimate jardinet de saló of 1926 to the contested rooftop as ecological infrastructure in 2025."
   data-es="La exposición establece un diálogo a lo largo de un siglo: quince maquetas de jardines cerámicos —una original de 1927 y catorce nuevas obras de arquitectos y paisajistas de reconocimiento internacional— instaladas en distintos puntos del Jardín Botánico de Barcelona, en la montaña de Montjuïc. Juntas trazan la evolución del jardín como forma de pensamiento urbano: desde el íntimo jardín de salón de 1926 hasta la cubierta disputada como infraestructura ecológica en 2025."
   data-ca="L’exposició estableix un diàleg al llarg d’un segle: quinze maquetes de jardins ceràmics —una d’original de 1927 i catorze noves obres d’arquitectes i paisatgistes de reconeixement internacional— instal·lades al Jardí Botànic de Barcelona, a la muntanya de Montjuïc. Juntes tracen l’evolució del jardí com a forma de pensament urbà: des del jardinet de saló de 1926 fins a la coberta disputada com a infraestructura ecològica el 2025.">
</p>

<p style="font-size: 15px"
   data-en="Each design has been adapted to their ceramic form by the ceramist and designer Martí Baltà and his team. To achieve this, they have used different direct ceramic 3D printing technologies combined with traditional techniques and a knowledge of glazes as well as finishes inherent to the craft."
   data-es="Cada diseño ha sido adaptado a su forma cerámica por el ceramista y diseñador Martí Baltà y su equipo. Para lograrlo, han utilizado diferentes tecnologías de impresión cerámica 3D directa combinadas con técnicas tradicionales y con un conocimiento de esmaltes y acabados propios del oficio."
   data-ca="Cada disseny ha estat adaptat a la seva forma ceràmica pel ceramista i dissenyador Martí Baltà i el seu equip. Per aconseguir-ho, han utilitzat diferents tecnologies d’impressió ceràmica 3D directa combinades amb tècniques tradicionals i amb un coneixement d’esmalts i acabats propi de l’ofici.">
</p>

<p style="font-size: 15px"
   data-en="The exhibition employs a déballage strategy, presenting each model directly on its wooden transport crate — revealing the process and materiality of displacement. Models are positioned throughout the garden's homoclimatic regions: the placement of each work echoes the climate zone of its designer's country of practice."
   data-es="La exposición emplea una estrategia de déballage, presentando cada maqueta directamente sobre su caja de transporte de madera, revelando así el proceso y la materialidad del desplazamiento. Las maquetas se sitúan a lo largo de las regiones homoclimáticas del jardín: la ubicación de cada obra evoca la zona climática del país de donde procede su diseñador."
   data-ca="L’exposició empra una estratègia de déballage, presentant cada maqueta directament sobre la seva caixa de transport de fusta, revelant així el procés i la materialitat del desplaçament. Les maquetes se situen al llarg de les regions homoclimàtiques del jardí: la ubicació de cada obra evoca la zona climàtica del país d’on procedeix el seu dissenyador.">
</p>

<script>
  // Fade in on page load
  document.addEventListener("DOMContentLoaded", () => {
    const container = document.querySelector(".fade-container");
    container.classList.add("fade-in");

    // Fade out on link click
    document.querySelectorAll("a[href]").forEach(link => {
      link.addEventListener("click", e => {
        const url = link.getAttribute("href");

        // Ignore external links
        if (url.startsWith("http")) return;

        e.preventDefault();
        container.classList.add("fade-out");

        setTimeout(() => {
          window.location = url;
        }, 500); // match CSS transition
      });
    });
  });
</script>

<script>
window.addEventListener("pageshow", (event) => {
  if (event.persisted) {
    const container = document.querySelector(".fade-container");
    container.classList.remove("fade-out");
    container.classList.add("fade-in");
  }
});
</script>
<script>
function applyLang(lang) {
  document.querySelectorAll("[data-en]").forEach(el => {
    const value = el.getAttribute(`data-${lang}`);
    if (value) {
      el.innerHTML = value;
    }
  });
}

function setLang(lang) {
  applyLang(lang);
  localStorage.setItem("lang", lang);
}

window.addEventListener("DOMContentLoaded", () => {
  const savedLang = localStorage.getItem("lang");

  // ALWAYS default to English first
  applyLang("en");

  // then override if user previously chose something else
  if (savedLang && savedLang !== "en") {
    applyLang(savedLang);
  }
});
</script>
