  <h1 class="hover-green" style="margin:0;">Sky Islands</h1>


  <h3 style="font-size: 15px; color:#555; margin:0;">A Liveforever Crevice Garden</h3>
  <p style="font-size: 15px"
    data-en= "California’s Pacific Coast is a place of elemental forces, of rugged beauty, of rich biodiversity. It is a place of dynamic activity and change moving forward at simultaneous but varied time scales. Geologic sea stacks and stumps - micro-islands that punctuate California’s coastal waters, jut up above crashing waves. Pummeled by wind, baked in sun, shrouded in fog, harsh conditions make these places feel inhospitable to life. Nevertheless, unique species and ecosystems inhabit rocky cliffs and crevices above and below the water’s surface."
    data-es= "La costa pacífica de California es un lugar de fuerzas elementales, de belleza abrupta y de rica biodiversidad. Es un lugar de actividad dinámica y grandes cambios que avanza simultáneamente a escalas temporales diversas. Los farallones y pilares marinos geológicos — microislas que salpican las aguas costeras de California — emergen por encima de las olas. Azotados por el viento, abrasados por el sol y envueltos en niebla, las condiciones duras hacen que estos lugares parezcan inhóspitos para la vida. Sin embargo, especies y ecosistemas únicos habitan acantilados rocosos y grietas por encima y por debajo de la superficie del agua."
    data-ca= "La costa pacífica de Califòrnia és un indret caracteritzat per les forces elementals, de bellesa abrupta i de rica biodiversitat. És un espai d’activitat dinàmica i de canvi que avança a escales temporals simultànies però diverses. Agulles geològiques i farallons marins —microilles que puntuen les aigües costaneres de Califòrnia— s’aixequen per damunt de les onades. Colpejats pel vent, a ple sol i embolcallats per la boira, les dures condicions als quals estan sotmesos fan que semblin uns llocs inhòspits per a la vida. Malgrat això, espècies i ecosistemes únics habiten els penya-segats i les esquerdes rocoses, per damunt i per sota de la superfície de l’aigua."
    >
  </p>
  <p style="font-size: 15px"
    data-en= "PWP’s parlour garden takes inspiration from California’s rocky coastline and the plants that grow there, just as our practice is often inspired by the interrelated systems and environmental drama of the land we call home. Many of our recent projects are sited on urban rooftops where environmental conditions can mirror the extremes of California’s coastal islands. Limited soil, high wind, periodic drenching, and extended periods of drought are all conditions found on coastal islands and urban rooftops (Islands in the Sky). Our garden blends these realities in an abstraction of dramatic coastal geology. Not only a Parlour Garden, the “Islands” also model possible methods for large scale 3d printed constructions that could create biomorphic and geometric crevice gardens of ideal habitat."
    data-es= "El jardín de salón de PWP se inspira en la costa rocosa de California y en las plantas que crecen allí, del mismo modo que nuestra práctica suele inspirarse en los sistemas interrelacionados y el drama ambiental de la tierra que llamamos hogar. Muchos de nuestros proyectos recientes se sitúan en azoteas urbanas donde las condiciones ambientales pueden reflejar las condiciones extremas de las islas costeras de California. Suelo limitado, vientos fuertes, chaparrones periódicos y largos periodos de sequía son condiciones presentes tanto en las islas costeras como en las azoteas urbanas (Islas en el cielo). Nuestro jardín combina estas realidades en una abstracción de una geología costera dramática. Además de ser un Jardín de Salón, las «Islas» también son posibles métodos para construcciones impresas en 3D a gran escala que podrían crear jardines de grietas biomórficos y geométricos de hábitat ideal."
    data-ca= "El jardí de saló de PWP s’inspira en la costa rocosa de Califòrnia i en les plantes que hi creixen, de la mateixa manera que la nostra pràctica sovint s’inspira en els sistemes interrelacionats i en l’entorn que anomenem casa. Molts dels nostres projectes recents se situen en cobertes urbanes, on les condicions ambientals poden reflectir les condicions extremes de les illes costaneres de Califòrnia. Sòl limitat, vents forts, ruixats periòdics i períodes prolongats de sequera són condicions que es troben tant a les illes costaneres com als terrats urbans (Illes al cel). El nostre jardí combina aquestes realitats en una abstracció de geologia costanera dramàtica. Més que un jardí de saló, les “Illes” també poden ser mètodes per a construccions impreses en 3D a gran escala que podrien crear jardins d’esquerdes biomòrfics i geomètrics d’hàbitat ideal."
    >
  </p>
  <p style="font-size: 15px"
    data-en= "Dudleyas, succulents known as Liveforevers because they can live for over 50 years, are endemic to California and adapted to Mediterranean climates. They inhabit steep, rocky cliffs, canyons, and near-vertical slopes with minimal soil and excellent drainage - habitats that are challenging for other plants. In Sky Islands, succulents root within narrow ceramic crevices, like native Dudleya and Sedum on California’s coast, transforming rockfaces and vertical walls into living habitats. Diverse species occupy the taller structures while mat-forming Sedum, Pratia, Frankenia, or seedling Dudleya fill the lower sections. Plants soften the forms with color, texture, and seasonal change."
    data-es= "Las Dudleya, suculentas conocidas como «siemprevivas» porque pueden vivir más de cincuenta años, son endémicas de California y están adaptadas a los climas mediterráneos. Habitan acantilados escarpados, cañones y laderas casi verticales con suelo mínimo y excelente drenaje: hábitats difíciles para otras plantas. En Sky Islands, las suculentas arraigan dentro de estrechas grietas cerámicas, como las Dudleya y Sedum nativas de la costa de California, transformando paredes rocosas y muros verticales en hábitats vivos. Varias especies ocupan las estructuras más altas, mientras que Sedum, Pratia, Frankenia o plántulas de Dudleya llenan las secciones inferiores. Las plantas suavizan las formas con color, textura y cambio estacional."
    data-ca= "Les dudleyes, suculentes conegudes com a «semprevives» perquè poden viure més de cinquanta anys, són endèmiques de Califòrnia i estan adaptades als climes mediterranis. Habiten penya-segats escarpats, canyons i vessants gairebé verticals amb molt poc sòl i un drenatge excel·lent: hàbitats difícils per a altres plantes. A Sky Islands, les suculentes arrelen dins d’estretes esquerdes ceràmiques, com les Dudleya i Sedum natives de la costa californiana, transformant parets rocoses i murs verticals en hàbitats vius. Diverses espècies ocupen les estructures més altes, mentre que Sedum, Pratia, Frankenia o plàntules de Dudleya omplen les seccions inferiors. Les plantes suavitzen les formes amb color, textura i canvi estacional."
    >
  </p>
  <p style="font-size: 15px"
    data-en= "A gently meandering space for people is carved out between the sculptural island forms and constructed wall planters. The space guides visitors like a coastal trail might - always offering a new vantage and inviting movement through, rather than static viewing. The 3d printed ceramic garden suggests a model for what contemporary rooftops could become: small but meaningful habitats, places of biodiversity and resilience, vital landscapes that reveal that nature can thrive in the unexpected crevices of the built environment."
    data-es= "Entre las formas escultóricas de las islas y las jardineras murales construidas se excava un espacio serpenteante para las personas. El espacio guía a los visitantes como podría hacerlo un sendero costero: ofreciendo siempre una nueva perspectiva e invitando al movimiento a través de él, más que a una contemplación estática. El jardín cerámico impreso en 3D sugiere un modelo de lo que podrían llegar a ser las azoteas contemporáneas: hábitats pequeños pero significativos, lugares de biodiversidad y resiliencia, paisajes vitales que revelan que la naturaleza puede prosperar en las grietas inesperadas del entorno construido."
    data-ca= "Entre les formes escultòriques de les illes i les jardineres-mur construïdes s’hi excava un espai serpentejant per a les persones. L’espai guia els visitants com ho podria fer un camí costaner: oferint sempre un nou punt de vista i convidant al moviment, més que no pas a una contemplació estàtica. El jardí ceràmic imprès en 3D suggereix un model del que podrien esdevenir els terrats contemporanis: hàbitats petits però significatius, espais de biodiversitat i resiliència, paisatges vitals que revelen que la natura pot prosperar en les esquerdes inesperades de l’entorn construït."
    >
  </p>

    <p style="font-size: 15px; color:#555;"
      data-en= "Adam Greenspan, FASLA, is a landscape architect and Design Director at PWP Landscape Architecture in Berkeley, California. With degrees in sociology, installation art and a background in horticulture, Adam’s work aims to bring the wonder of life and the power of nature into people’s everyday experience through design. The drama of natural landscapes and the potential for shared insight through engagement with art have been key drivers in his practice. At PWP, Adam has worked to integrate living systems holistically, and has focused on increasing the level of ecological service and the potential for engaged learning in all projects. Working with a wide array of clients, Adam and the team at PWP aim to create intimacy between people and the natural world within dramatic and memorable spaces in a wide variety of settings including Salesforce Transit Center Park, San Francisco, Barangaroo Reserve, Sydney, Australia, Jewel Changi Airport, Glenstone Museum, Potomac, MD, Marina Bay Sands Integrated Resort, Singapore and Constitution Gardens on the National Mall, Washington DC."
      data-es= "Adam Greenspan, FASLA, es arquitecto paisajista y director de diseño en PWP Landscape Architecture, en Berkeley, California. Con formación en sociología, arte de instalación y horticultura, el trabajo de Adam aspira a llevar el asombro de la vida y la fuerza de la naturaleza a la experiencia cotidiana de las personas a través del diseño. El dramatismo de los paisajes naturales y el potencial de aprendizaje compartido mediante el encuentro con el arte han sido motores clave de su práctica. En PWP, Adam ha trabajado para integrar los sistemas vivos de manera holística y se ha centrado en aumentar el nivel de servicio ecológico y el potencial de aprendizaje activo en todos los proyectos. Trabajando con una amplia gama de clientes, Adam y el equipo de PWP buscan crear intimidad entre las personas y el mundo natural en espacios memorables y de gran intensidad, en contextos tan diversos como Barangaroo Reserve, Jewel Changi Airport, Salesforce Transit Center Park en San Francisco, Glenstone Museum en Potomac, Maryland, y Marina Bay Sands Integrated Resort en Singapur."
      data-ca= "Adam Greenspan, FASLA, és arquitecte paisatgista i director de disseny a PWP Landscape Architecture, a Berkeley, Califòrnia. Amb formació en sociologia, art d’instal·lació i horticultura, el treball d’Adam aspira a portar la meravella de la vida i la força de la natura a l’experiència quotidiana de les persones a través del disseny. El dramatisme dels paisatges naturals i el potencial d’aprenentatge compartit mitjançant el contacte amb l’art han estat motors clau de la seva pràctica. A PWP, Adam ha treballat per integrar els sistemes vius de manera holística i s’ha centrat a augmentar el nivell de servei ecològic i el potencial d’aprenentatge actiu en tots els projectes. Treballant amb una àmplia gamma de clients, Adam i l’equip de PWP busquen crear intimitat entre les persones i el món natural en espais memorables i de gran intensitat, en contextos tan diversos com Barangaroo Reserve, Jewel Changi Airport, Salesforce Transit Center Park a San Francisco, Glenstone Museum a Potomac, Maryland, i Marina Bay Sands Integrated Resort a Singapur.">

<script>
const track = document.querySelector('.smooth-slider-track');
const leftBtn = document.querySelector('.slider-arrow.left');
const rightBtn = document.querySelector('.slider-arrow.right');

let x = 0;                 // current horizontal position
let speed = 0.5;           // auto-scroll speed
let paused = false;
let resumeTimer;

// AUTO SCROLL LOOP
function autoScroll() {
  if (!paused) {
    x -= speed;
    track.style.transform = `translateX(${x}px)`;

    // LOOPING LOGIC
    const halfWidth = track.scrollWidth / 2;
    if (Math.abs(x) >= halfWidth) {
      x = 0; // reset to start
      track.style.transform = `translateX(0)`;
    }
  }

  requestAnimationFrame(autoScroll);
}
autoScroll();

// PAUSE AUTO SCROLL
function pauseAuto() {
  paused = true;
  clearTimeout(resumeTimer);
  resumeTimer = setTimeout(() => {
    paused = false;
  }, 2000);
}

// BUTTON: MOVE LEFT
leftBtn.addEventListener('click', () => {
  pauseAuto();
  x += 200;
  track.style.transform = `translateX(${x}px)`;
});

// BUTTON: MOVE RIGHT
rightBtn.addEventListener('click', () => {
  pauseAuto();
  x -= 200;
  track.style.transform = `translateX(${x}px)`;
});
</script>

<script>
  // Fade in on page load
  document.addEventListener("DOMContentLoaded", () => {
    const container = document.querySelector(".fade-container");
    container.classList.add("fade-in");

    // Fade out on link click
    document.querySelectorAll("a[href]").forEach(link => {
      link.addEventListener("click", e => {
        const url = link.getAttribute("href");

        // Ignore external links
        if (url.startsWith("http")) return;

        e.preventDefault();
        container.classList.add("fade-out");

        setTimeout(() => {
          window.location = url;
        }, 500); // match CSS transition
      });
    });
  });
</script>
<script>
window.addEventListener("pageshow", (event) => {
  if (event.persisted) {
    const container = document.querySelector(".fade-container");
    container.classList.remove("fade-out");
    container.classList.add("fade-in");
  }
});
</script>
<script>
window.addEventListener("scroll", () => {
  document.documentElement.style.setProperty(
    "--scroll-offset",
    `${window.scrollY * -1.95}px`
  );
});
</script>
<script>
function applyLang(lang) {
  document.querySelectorAll("[data-en]").forEach(el => {
    const value = el.getAttribute(`data-${lang}`);
    if (value) {
      el.innerHTML = value;
    }
  });
}

function setLang(lang) {
  applyLang(lang);
  localStorage.setItem("lang", lang);
}

window.addEventListener("DOMContentLoaded", () => {
  const savedLang = localStorage.getItem("lang");

  // ALWAYS default to English first
  applyLang("en");

  // then override if user previously chose something else
  if (savedLang && savedLang !== "en") {
    applyLang(savedLang);
  }
});
</script>
