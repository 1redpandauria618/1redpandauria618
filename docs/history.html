<h3 style="font-size: 15px; color:#555; margin:0;"
    data-en="Origins of the Parlour Garden · 1926"
    data-ca="Orígens del jardí de saló · 1926"
    data-es="Orígenes del jardín de salón · 1926">
</h3>

<p data-en="The spring of 1926 marked the beginning of an unlikely collaboration at the intersection of three disciplines. The architect and landscape designer Nicolau M. Rubió i Tudurí, ceramicist Josep Llorens i Artigas, and French painter Raoul Dufy joined forces to create a series of parlour gardens: miniature ceramic worlds that condensed the spirit of the natural landscape into vessels small enough to rest on a table."
   data-ca="La primavera de 1926 va marcar l’inici d’una col·laboració improbable en la intersecció de tres disciplines. L’arquitecte i paisatgista Nicolau M. Rubió i Tudurí, el ceramista Josep Llorens i Artigas i el pintor francès Raoul Dufy van unir forces per crear una sèrie de jardinets de saló: mons ceràmics en miniatura que condensaven l’esperit del paisatge natural en recipients prou petits per reposar sobre una taula."
   data-es="La primavera de 1926 marcó el inicio de una colaboración improbable en la intersección de tres disciplinas. El arquitecto y paisajista Nicolau M. Rubió i Tudurí, el ceramista Josep Llorens i Artigas y el pintor francés Raoul Dufy unieron fuerzas para crear una serie de jardines de salón: mundos cerámicos en miniatura que condensaban el espíritu del paisaje natural en recipientes lo bastante pequeños como para reposar sobre una mesa.">
</p>

<p data-en="Drawing from the tradition of miniature gardens reaching back to ancient Egypt, and deeply influenced by Japonism, these works proposed something new: the garden not as a place to inhabit, but as an image to contemplate."
   data-ca="Inspirades en la tradició dels jardins en miniatura, que es remunta a l’antic Egipte, i profundament marcades per la sensibilitat japonista, aquestes obres proposaven una cosa nova: el jardí no com un lloc per habitar, sinó com una imatge per contemplar."
   data-es="Inspiradas en la tradición de los jardines en miniatura, que se remonta al antiguo Egipto, y profundamente marcadas por la sensibilidad japonista, estas obras proponían algo nuevo: el jardín no como un lugar para habitar, sino como una imagen para contemplar.">
</p>

<p data-en="Each piece was made of glazed ceramic measuring approximately 45 × 45 × 25 cm, merging architectural model, decorative object, and living planter."
   data-ca="Cada peça estava feta de ceràmica vidrada d’aproximadament 45 × 45 × 25 cm, fusionant maqueta arquitectònica, objecte decoratiu i jardinera viva."
   data-es="Cada pieza estaba realizada en cerámica vidriada de aproximadamente 45 × 45 × 25 cm, fusionando maqueta arquitectónica, objeto decorativo y jardinera viva.">
</p>

</script>
<script>
const track = document.querySelector('.smooth-slider-track');
const leftBtn = document.querySelector('.slider-arrow.left');
const rightBtn = document.querySelector('.slider-arrow.right');

let x = 0;                 // current horizontal position
let speed = 0.5;           // auto-scroll speed
let paused = false;
let resumeTimer;

// AUTO SCROLL LOOP
function autoScroll() {
  if (!paused) {
    x -= speed;
    track.style.transform = `translateX(${x}px)`;

    // LOOPING LOGIC
    const halfWidth = track.scrollWidth / 2;
    if (Math.abs(x) >= halfWidth) {
      x = 0; // reset to start
      track.style.transform = `translateX(0)`;
    }
  }

  requestAnimationFrame(autoScroll);
}
autoScroll();

// PAUSE AUTO SCROLL
function pauseAuto() {
  paused = true;
  clearTimeout(resumeTimer);
  resumeTimer = setTimeout(() => {
    paused = false;
  }, 2000);
}

// BUTTON: MOVE LEFT
leftBtn.addEventListener('click', () => {
  pauseAuto();
  x += 200;
  track.style.transform = `translateX(${x}px)`;
});

// BUTTON: MOVE RIGHT
rightBtn.addEventListener('click', () => {
  pauseAuto();
  x -= 200;
  track.style.transform = `translateX(${x}px)`;
});
</script>

<script>
  // Fade in on page load
  document.addEventListener("DOMContentLoaded", () => {
    const container = document.querySelector(".fade-container");
    container.classList.add("fade-in");

    // Fade out on link click
    document.querySelectorAll("a[href]").forEach(link => {
      link.addEventListener("click", e => {
        const url = link.getAttribute("href");

        // Ignore external links
        if (url.startsWith("http")) return;

        e.preventDefault();
        container.classList.add("fade-out");

        setTimeout(() => {
          window.location = url;
        }, 500); // match CSS transition
      });
    });
  });
</script>

<script>
window.addEventListener("pageshow", (event) => {
  if (event.persisted) {
    const container = document.querySelector(".fade-container");
    container.classList.remove("fade-out");
    container.classList.add("fade-in");
  }
});
</script>
<script>
function applyLang(lang) {
  document.querySelectorAll("[data-en]").forEach(el => {
    const value = el.getAttribute(`data-${lang}`);
    if (value) {
      el.innerHTML = value;
    }
  });
}

function setLang(lang) {
  applyLang(lang);
  localStorage.setItem("lang", lang);
}

window.addEventListener("DOMContentLoaded", () => {
  const savedLang = localStorage.getItem("lang");

  // ALWAYS default to English first
  applyLang("en");

  // then override if user previously chose something else
  if (savedLang && savedLang !== "en") {
    applyLang(savedLang);
  }
});
</script>
