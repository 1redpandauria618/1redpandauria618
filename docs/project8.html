  <h3 style="font-size: 15px; color:#555; margin:0;">Teresa Moller Landscape Studio</h3>
  <p style="font-size: 15px"
  data-en="This project is inspired by a captivating image of Machu Picchu: a single stone that becomes the center of a place, sustaining a solitary tree. It is a symbol of our history where stone and tree meet to celebrate the harmony between engineering, aesthetics, and spirituality. The chosen form contains the essence of the material the Incas used to integrate architecture deeply into nature. The chosen stone has not been worked by humans, yet it contains within itself the essence of the material the Incas chose to build their sites. It is an element that supports, frames, and makes possible an architecture deeply integrated with nature."
  data-es="Este proyecto se inspira en una imagen cautivadora de Machu Picchu: una sola piedra que se convierte en el centro de un lugar y sostiene un árbol solitario. Es un símbolo de nuestra historia, donde piedra y árbol se encuentran para celebrar la armonía entre ingeniería, estética y espiritualidad. La forma elegida contiene la esencia del material que los incas utilizaron para integrar profundamente la arquitectura en la naturaleza. La piedra elegida no ha sido trabajada por humanos, pero contiene en sí misma la esencia del material que los incas escogieron para construir sus sitios. Es un elemento que sostiene, enmarca y hace posible una arquitectura profundamente integrada con la naturaleza."
  data-ca="Aquest projecte s’inspira en una imatge captivadora de Machu Picchu: una sola pedra que esdevé el centre d’un lloc i sosté un arbre solitari. És un símbol de la nostra història, on pedra i arbre es troben per celebrar l’harmonia entre enginyeria, estètica i espiritualitat. La forma escollida conté l’essència del material que els inques van utilitzar per integrar profundament l’arquitectura en la natura. La pedra escollida no ha estat treballada per l’ésser humà i, tanmateix, conté en si mateixa l’essència del material que els inques van triar per construir els seus llocs. És un element que sosté, emmarca i fa possible una arquitectura profundament integrada amb la natura.">
</p>

<p style="font-size: 15px"
  data-en="Machu Picchu, nestled high in the Peruvian Andes, is a testament to the ingenuity and work ethic of the Incas. With effort, knowledge, and a profound connection to the landscape, they masterfully worked with stone, achieving extraordinary results: terraces, plazas, and temples that blend seamlessly with the mountains, creating a place where engineering, aesthetics, and spirituality coexist in harmony."
  data-es="Machu Picchu, enclavado en lo alto de los Andes peruanos, es un testimonio del ingenio y la ética del trabajo de los incas. Con esfuerzo, conocimiento y una profunda conexión con el paisaje, trabajaron magistralmente la piedra, logrando resultados extraordinarios: terrazas, plazas y templos que se integran perfectamente con las montañas, creando un lugar donde ingeniería, estética y espiritualidad coexisten en armonía."
  data-ca="Machu Picchu, enclavat a les altures dels Andes peruans, és testimoni de l’enginy i de l’ètica del treball dels inques. Amb esforç, coneixement i una connexió profunda amb el paisatge, van treballar magistralment la pedra i van aconseguir resultats extraordinaris: terrasses, places i temples que es fonen amb les muntanyes i creen un lloc on enginyeria, estètica i espiritualitat coexisteixen en harmonia.">
</p>

<p style="font-size: 15px"
  data-en="We do not seek to replicate Machu Picchu, but rather to convey an image that deeply captivated me and represents it: a stone that becomes the center of the site, supporting the existence of a solitary tree amidst a landscape filled with magic and tranquillity. This is the image I want to take to Barcelona as a symbol of our history in our Latin American architecture, where stone and tree meet, and together form a small garden that celebrates architecture, nature, memory, and the extraordinary ability to create architecture within the landscape. Teresa Moller / Teresa Moller Landscape Studio"
  data-es="No buscamos replicar Machu Picchu, sino transmitir una imagen que me cautivó profundamente y que lo representa: una piedra que se convierte en el centro del lugar, sosteniendo la existencia de un árbol solitario en medio de un paisaje lleno de magia y tranquilidad. Esta es la imagen que quiero llevar a Barcelona como símbolo de nuestra historia en la arquitectura latinoamericana, donde piedra y árbol se encuentran y, juntos, forman un pequeño jardín que celebra la arquitectura, la naturaleza, la memoria y la extraordinaria capacidad de crear arquitectura dentro del paisaje. Teresa Moller / Teresa Moller Landscape Studio"
  data-ca="No busquem replicar Machu Picchu, sinó transmetre una imatge que em va captivar profundament i que el representa: una pedra que esdevé el centre del lloc, sostenint l’existència d’un arbre solitari enmig d’un paisatge ple de màgia i tranquil·litat. Aquesta és la imatge que vull portar a Barcelona com a símbol de la nostra història en l’arquitectura llatinoamericana, on pedra i arbre es troben i, plegats, formen un petit jardí que celebra l’arquitectura, la natura, la memòria i l’extraordinària capacitat de crear arquitectura dins del paisatge. Teresa Moller / Teresa Moller Landscape Studio">
</p>

<script>

</script>
<script>
const track = document.querySelector('.smooth-slider-track');
const leftBtn = document.querySelector('.slider-arrow.left');
const rightBtn = document.querySelector('.slider-arrow.right');

let x = 0;                 // current horizontal position
let speed = 0.5;           // auto-scroll speed
let paused = false;
let resumeTimer;

// AUTO SCROLL LOOP
function autoScroll() {
  if (!paused) {
    x -= speed;
    track.style.transform = `translateX(${x}px)`;

    // LOOPING LOGIC
    const halfWidth = track.scrollWidth / 2;
    if (Math.abs(x) >= halfWidth) {
      x = 0; // reset to start
      track.style.transform = `translateX(0)`;
    }
  }

  requestAnimationFrame(autoScroll);
}
autoScroll();

// PAUSE AUTO SCROLL
function pauseAuto() {
  paused = true;
  clearTimeout(resumeTimer);
  resumeTimer = setTimeout(() => {
    paused = false;
  }, 2000);
}

// BUTTON: MOVE LEFT
leftBtn.addEventListener('click', () => {
  pauseAuto();
  x += 200;
  track.style.transform = `translateX(${x}px)`;
});

// BUTTON: MOVE RIGHT
rightBtn.addEventListener('click', () => {
  pauseAuto();
  x -= 200;
  track.style.transform = `translateX(${x}px)`;
});
</script>

<script>
  // Fade in on page load
  document.addEventListener("DOMContentLoaded", () => {
    const container = document.querySelector(".fade-container");
    container.classList.add("fade-in");

    // Fade out on link click
    document.querySelectorAll("a[href]").forEach(link => {
      link.addEventListener("click", e => {
        const url = link.getAttribute("href");

        // Ignore external links
        if (url.startsWith("http")) return;

        e.preventDefault();
        container.classList.add("fade-out");

        setTimeout(() => {
          window.location = url;
        }, 500); // match CSS transition
      });
    });
  });
</script>
<script>
window.addEventListener("pageshow", (event) => {
  if (event.persisted) {
    const container = document.querySelector(".fade-container");
    container.classList.remove("fade-out");
    container.classList.add("fade-in");
  }
});
</script>

</script>
<script>
function applyLang(lang) {
  document.querySelectorAll("[data-en]").forEach(el => {
    const value = el.getAttribute(`data-${lang}`);
    if (value) {
      el.innerHTML = value;
    }
  });
}

function setLang(lang) {
  applyLang(lang);
  localStorage.setItem("lang", lang);
}

window.addEventListener("DOMContentLoaded", () => {
  const savedLang = localStorage.getItem("lang");

  // ALWAYS default to English first
  applyLang("en");

  // then override if user previously chose something else
  if (savedLang && savedLang !== "en") {
    applyLang(savedLang);
  }
});
</script>
