  <h3 style="font-size: 15px; color:#555; margin:0;">Poor Man's Parlour</h3>
  <p style="font-size: 15px"
  data-en="Whether designed or vernacular, a garden is a manifestation of a relationship with nature in a specific place and time. In hot arid ecologies of the eastern Mediterranean, the aim is to render a sterile nature productive. A garden is a hybrid orchard and vegetable garden. Paradise imaginaries in the Quran and the Bible speak of shaded gardens, abundant water and ‘fruit trees of every kind’. There are lemon trees and pomegranate, fig and mulberry and grape vine. The idea of garden as combining pleasure and productivity is very much alive today in rural culture and in urban peripheries in Lebanon, Syria and Palestine. The colloquial Arabic name is hakura, a garden with fruit trees, jneine, diminutive of jenna, Arabic for Paradise, and potager referred to as sahra, Arabic for desert because nothing but fruit trees qualify as garden."
  data-es="Ya sea diseñado o vernáculo, un jardín es la manifestación de una relación con la naturaleza en un lugar y un tiempo concretos. En los ecosistemas cálidos y áridos del Mediterráneo oriental, el objetivo es hacer productiva una naturaleza estéril. Un jardín es un híbrido de huerto frutal y huerto de verduras. Los imaginarios del paraíso en el Corán y en la Biblia hablan de jardines sombreados, agua abundante y «árboles frutales de todo tipo». Hay limoneros y granados, higueras, moreras y parras. La idea del jardín como combinación de placer y productividad sigue muy viva hoy en la cultura rural y en las periferias urbanas del Líbano, Siria y Palestina. El nombre árabe coloquial es hakura, un jardín con árboles frutales; jneine, diminutivo de jenna, que en árabe significa Paraíso; y el huerto, llamado sahra, palabra árabe para desierto, porque nada que no sean árboles frutales cumple los requisitos de jardín."
  data-ca="Tant si és dissenyat com vernacular, un jardí és la manifestació d’una relació amb la natura en un lloc i un temps específics. En els ecosistemes càlids i àrids de la Mediterrània oriental, l’objectiu és fer productiva una natura estèril. Un jardí és un híbrid d’hort fruiter i hort de verdures. Els imaginaris del paradís a l’Alcorà i a la Bíblia parlen de jardins ombrejats, aigua abundant i «arbres fruiters de tota mena». Hi ha llimoners i magraners, figueres i moreres, i vinya. La idea del jardí com a combinació de plaer i productivitat continua molt viva avui en la cultura rural i en les perifèries urbanes del Líban, Síria i Palestina. El nom àrab col·loquial és hakura, un jardí amb arbres fruiters; jneine, diminutiu de jenna, la paraula àrab per a Paradís; mentre que l’hort es coneix com a sahra, paraula àrab per a desert, perquè res que no siguin arbres fruiters compleix els requisits de jardí.">
</p>

<p style="font-size: 15px"
  data-en="It is hard to reflect on the rich cultural heritage of folk gardens in isolation of the political landscape that has come to engulf this part of the world. The parlour garden we envisage combines past and present, the traditional conception of a hakura garden with the landscape of war and displacement that includes Palestinian and Syrian refugee camps and displaced Lebanese. The garden we envision is a reclaimed place, a rooftop or backyard, leftover space between makeshift homes or in a refugee camp. An improvised, self-help garden, a poor man’s parlour. It is an affordable garden that uses low-cost, discarded car tires and tin cans, that are readily available, as makeshift planters."
  data-es="Es difícil reflexionar sobre el rico patrimonio cultural de los jardines populares aislándolo del paisaje político que ha llegado a engullir esta parte del mundo. El jardín de salón que imaginamos combina pasado y presente: la concepción tradicional de un jardín hakura con el paisaje de guerra y desplazamiento que incluye campos de refugiados palestinos y sirios y libaneses desplazados. El jardín que imaginamos es un lugar recuperado, una azotea o un patio trasero, un espacio residual entre viviendas improvisadas o dentro de un campo de refugiados. Un jardín improvisado y de autoayuda, el salón del pobre. Es un jardín asequible que utiliza neumáticos de coche desechados y latas, fácilmente disponibles, de bajo coste, como jardineras improvisadas."
  data-ca="És difícil reflexionar sobre el ric patrimoni cultural dels jardins populars aïllant-lo del paisatge polític que ha acabat engolint aquesta part del món. El jardí de saló que imaginem combina passat i present: la concepció tradicional d’un jardí hakura amb el paisatge de guerra i desplaçament que inclou camps de refugiats palestins i sirians i libanesos desplaçats. El jardí que imaginem és un lloc recuperat, un terrat o un pati del darrere, un espai residual entre habitatges improvisats o dins d’un camp de refugiats. Un jardí improvisat, autogestionat, un saló del pobre. És un jardí assequible que utilitza pneumàtics de cotxe i llaunes, descartats, de baix cost i fàcilment disponibles, com a jardineres improvisades.">
</p>

<script>
const track = document.querySelector('.smooth-slider-track');
const leftBtn = document.querySelector('.slider-arrow.left');
const rightBtn = document.querySelector('.slider-arrow.right');

let x = 0;                 // current horizontal position
let speed = 0.5;           // auto-scroll speed
let paused = false;
let resumeTimer;

// AUTO SCROLL LOOP
function autoScroll() {
  if (!paused) {
    x -= speed;
    track.style.transform = `translateX(${x}px)`;

    // LOOPING LOGIC
    const halfWidth = track.scrollWidth / 2;
    if (Math.abs(x) >= halfWidth) {
      x = 0; // reset to start
      track.style.transform = `translateX(0)`;
    }
  }

  requestAnimationFrame(autoScroll);
}
autoScroll();

// PAUSE AUTO SCROLL
function pauseAuto() {
  paused = true;
  clearTimeout(resumeTimer);
  resumeTimer = setTimeout(() => {
    paused = false;
  }, 2000);
}

// BUTTON: MOVE LEFT
leftBtn.addEventListener('click', () => {
  pauseAuto();
  x += 200;
  track.style.transform = `translateX(${x}px)`;
});

// BUTTON: MOVE RIGHT
rightBtn.addEventListener('click', () => {
  pauseAuto();
  x -= 200;
  track.style.transform = `translateX(${x}px)`;
});
</script>

<script>
  // Fade in on page load
  document.addEventListener("DOMContentLoaded", () => {
    const container = document.querySelector(".fade-container");
    container.classList.add("fade-in");

    // Fade out on link click
    document.querySelectorAll("a[href]").forEach(link => {
      link.addEventListener("click", e => {
        const url = link.getAttribute("href");

        // Ignore external links
        if (url.startsWith("http")) return;

        e.preventDefault();
        container.classList.add("fade-out");

        setTimeout(() => {
          window.location = url;
        }, 500); // match CSS transition
      });
    });
  });
</script>
<script>
window.addEventListener("pageshow", (event) => {
  if (event.persisted) {
    const container = document.querySelector(".fade-container");
    container.classList.remove("fade-out");
    container.classList.add("fade-in");
  }
});
</script>

<script>
function applyLang(lang) {
  document.querySelectorAll("[data-en]").forEach(el => {
    const value = el.getAttribute(`data-${lang}`);
    if (value) {
      el.innerHTML = value;
    }
  });
}

function setLang(lang) {
  applyLang(lang);
  localStorage.setItem("lang", lang);
}

window.addEventListener("DOMContentLoaded", () => {
  const savedLang = localStorage.getItem("lang");

  // ALWAYS default to English first
  applyLang("en");

  // then override if user previously chose something else
  if (savedLang && savedLang !== "en") {
    applyLang(savedLang);
  }
});
</script>
