  <h3 style="font-size: 15px; color:#555; margin:0;">Heavenly Garden</h3>
  <p style="font-size: 15px"
  data-en="The heights of a building’s rooftops are perceived as a place close to the sky, the moon, and the sun. I reinterpret these elements in an abstract way in the composition of my arabesque on the rooftops of Barcelona. Viewed from above, my arabesque is perceived as the Medusa where the various curves of the form express movement, while the plants convey rest and calm."
  data-es="Las alturas de las azoteas de un edificio se perciben como un lugar cercano al cielo, la luna y el sol. Reinterpreto estos elementos de manera abstracta en la composición de mi arabesco en las azoteas de Barcelona. Visto desde arriba, mi arabesco se percibe como Medusa, donde las distintas curvas de la forma expresan movimiento, mientras que las plantas transmiten reposo y calma."
  data-ca="Les altures dels terrats d’un edifici es perceben com un lloc pròxim al cel, la lluna i el sol. Reinterpreto aquests elements d’una manera abstracta en la composició del meu arabesc als terrats de Barcelona. Vist des de dalt, el meu arabesc es percep com la Medusa, on les diverses corbes de la forma expressen moviment, mentre que les plantes transmeten repòs i calma.">
</p>

<p style="font-size: 15px"
  data-en="The central part, composed with a star, symbolizes the planet and the sun (in Barcelona blue). The raised oval shapes are (white) contemplative light fixtures with engraved (blue) stars that symbolize the movement of the moon around the imagined planet. The shapes around the light fixtures (towards the outside) are benches/armchairs covered with blue ceramic, referencing Gaudí’s art in Barcelona and allowing for peaceful contemplation of the garden. The star is a modulation of blue colour, surrounded by thyme plants (Thymus serpyllum ‘Coccineus’). Planting in the areas along the outer lines of the square is composed of scab plant (Raoulia australis)."
  data-es="La parte central, en forma de estrella, simboliza el planeta y el sol (en el azul de Barcelona). Las formas ovaladas elevadas son luminarias contemplativas (blancas) con estrellas (azules) grabadas que simbolizan el movimiento de la luna alrededor del planeta imaginado. Las formas alrededor de las luminarias (hacia el exterior) son bancos/sillones recubiertos de cerámica azul, en referencia al arte de Gaudí en Barcelona y permiten una contemplación pacífica del jardín. La estrella es una modulación de color azul, rodeada de plantas de tomillo (Thymus serpyllum «Coccineus»). La plantación en los bordes exteriores del cuadrado se compone de oveja vegetal (Raoulia australis)."
  data-ca="La part central, em forma d’estrella, simbolitza el planeta i el sol (en blau Barcelona). Les formes ovalades elevades són lluminàries contemplatives (blanques) amb estrelles gravades (blaves) que simbolitzen el moviment de la lluna al voltant del planeta imaginat. Les formes al voltant de les lluminàries (cap a l’exterior) són bancs/butaques revestits de ceràmica blava, en referència a l’art de Gaudí a Barcelona i permeten una contemplació tranquil·la del jardí. L’estrella és una modulació de color blau, envoltada de plantes de farigola (Thymus serpyllum “Coccineus”). La plantació a les vores exteriors del quadrat està es compon d’ovella vegetal (Raoulia australis).">
</p>

<p style="font-size: 15px"
  data-en="The arabesque expresses diversity, harmony, and above all the small paradise that all parks and gardens of the world seek to reflect. Thanks to its proximity to the sky, our arabesque expresses this paradise by inspiring all cultures."
  data-es="El arabesco expresa diversidad, armonía y, sobre todo, el pequeño paraíso que todos los parques y jardines del mundo buscan reflejar. Gracias a su proximidad al cielo, nuestro arabesco expresa este paraíso inspirando a todas las culturas."
  data-ca="L’arabesc expressa diversitat, harmonia i, sobretot, el petit paradís que tots els parcs i jardins del món aspiren a reflectir. Gràcies a la seva proximitat al cel, el nostre arabesc expressa aquest paradís inspirant totes les cultures.">
</p>

<script>
  const lenis = new Lenis({
    duration: 1.2,
    easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
    smooth: true
  });

  function raf(time) {
    lenis.raf(time);
    requestAnimationFrame(raf);
  }

  requestAnimationFrame(raf);
</script>
<script>
const track = document.querySelector('.smooth-slider-track');
const leftBtn = document.querySelector('.slider-arrow.left');
const rightBtn = document.querySelector('.slider-arrow.right');

let x = 0;                 // current horizontal position
let speed = 0.5;           // auto-scroll speed
let paused = false;
let resumeTimer;

// AUTO SCROLL LOOP
function autoScroll() {
  if (!paused) {
    x -= speed;
    track.style.transform = `translateX(${x}px)`;

    // LOOPING LOGIC
    const halfWidth = track.scrollWidth / 2;
    if (Math.abs(x) >= halfWidth) {
      x = 0; // reset to start
      track.style.transform = `translateX(0)`;
    }
  }

  requestAnimationFrame(autoScroll);
}
autoScroll();

// PAUSE AUTO SCROLL
function pauseAuto() {
  paused = true;
  clearTimeout(resumeTimer);
  resumeTimer = setTimeout(() => {
    paused = false;
  }, 2000);
}

// BUTTON: MOVE LEFT
leftBtn.addEventListener('click', () => {
  pauseAuto();
  x += 200;
  track.style.transform = `translateX(${x}px)`;
});

// BUTTON: MOVE RIGHT
rightBtn.addEventListener('click', () => {
  pauseAuto();
  x -= 200;
  track.style.transform = `translateX(${x}px)`;
});
</script>

<script>
  // Fade in on page load
  document.addEventListener("DOMContentLoaded", () => {
    const container = document.querySelector(".fade-container");
    container.classList.add("fade-in");

    // Fade out on link click
    document.querySelectorAll("a[href]").forEach(link => {
      link.addEventListener("click", e => {
        const url = link.getAttribute("href");

        // Ignore external links
        if (url.startsWith("http")) return;

        e.preventDefault();
        container.classList.add("fade-out");

        setTimeout(() => {
          window.location = url;
        }, 500); // match CSS transition
      });
    });
  });
</script>
<script>
window.addEventListener("pageshow", (event) => {
  if (event.persisted) {
    const container = document.querySelector(".fade-container");
    container.classList.remove("fade-out");
    container.classList.add("fade-in");
  }
});
</script>
<script>

  );
});
</script>
<script>
function applyLang(lang) {
  document.querySelectorAll("[data-en]").forEach(el => {
    const value = el.getAttribute(`data-${lang}`);
    if (value) {
      el.innerHTML = value;
    }
  });
}

function setLang(lang) {
  applyLang(lang);
  localStorage.setItem("lang", lang);
}

window.addEventListener("DOMContentLoaded", () => {
  const savedLang = localStorage.getItem("lang");

  // ALWAYS default to English first
  applyLang("en");

  // then override if user previously chose something else
  if (savedLang && savedLang !== "en") {
    applyLang(savedLang);
  }
});
</script>
