<script>
  /* Smooth scrolling (Lenis) */
  const lenis = new Lenis({
    duration: 1.2,
    easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
    smooth: true
  });

  function raf(time) {
    lenis.raf(time);
    requestAnimationFrame(raf);
  }
  requestAnimationFrame(raf);
</script>

<script>
  /* Ripple click animation for project thumbnails */
  document.querySelectorAll('.project').forEach(project => {
    project.addEventListener('click', function(e) {
      e.preventDefault();

      const url = this.getAttribute("href");
      const rect = this.getBoundingClientRect();
      const ripple = document.createElement("span");

      const size = Math.max(rect.width, rect.height) * 1.6;
      ripple.style.width = ripple.style.height = size + "px";

      const x = e.clientX - rect.left - size / 2;
      const y = e.clientY - rect.top - size / 2;

      ripple.style.left = x + "px";
      ripple.style.top = y + "px";

      ripple.classList.add("ripple");
      this.appendChild(ripple);

      requestAnimationFrame(() => {
        ripple.classList.add("active");
      });

      setTimeout(() => {
        window.location = url;
      }, 650);
    });
  });
</script>

<script>
  /* Intro overlay — only shows once per session */
  const overlay = document.getElementById("intro-overlay");

  if (sessionStorage.getItem("introShown")) {
    overlay.style.display = "none";
  } else {
    sessionStorage.setItem("introShown", "true");
  }
</script>

<script>
  /* Fade in on page load + fade out on navigation */
  document.addEventListener("DOMContentLoaded", () => {
    const container = document.querySelector(".fade-container");
    container.classList.add("fade-in");

    document.querySelectorAll("a[href]").forEach(link => {
      link.addEventListener("click", e => {
        const url = link.getAttribute("href");

        if (url.startsWith("http")) return;

        e.preventDefault();
        container.classList.add("fade-out");

        setTimeout(() => {
          window.location = url;
        }, 500);
      });
    });
  });
</script>

<script>
  /* Fix fade-in when navigating back */
  window.addEventListener("pageshow", (event) => {
    if (event.persisted) {
      const container = document.querySelector(".fade-container");
      container.classList.remove("fade-out");
      container.classList.add("fade-in");
    }
  });
</script>
