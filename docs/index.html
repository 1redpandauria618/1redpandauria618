<script>
  const lenis = new Lenis({
    duration: 1.2,
    easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
    smooth: true
  });

  function raf(time) {
    lenis.raf(time);
    requestAnimationFrame(raf);
  }

  requestAnimationFrame(raf);
</script>

<script>
document.querySelectorAll('.project').forEach(project => {
  project.addEventListener('click', function(e) {
    e.preventDefault();  // stop instant navigation

    const url = this.getAttribute("href");
    const rect = this.getBoundingClientRect();
    const ripple = document.createElement("span");

    const size = Math.max(rect.width, rect.height) * 1.6;
    ripple.style.width = ripple.style.height = size + "px";

    const x = e.clientX - rect.left - size / 2;
    const y = e.clientY - rect.top - size / 2;

    ripple.style.left = x + "px";
    ripple.style.top = y + "px";

    ripple.classList.add("ripple");
    this.appendChild(ripple);

    requestAnimationFrame(() => {
      ripple.classList.add("active");
    });

    // ⏳ wait for elegant animation, THEN change page
    setTimeout(() => {
      window.location = url;
    }, 650); // adjust to match your ripple duration
  });
});
</script>

<script>
  // Fade in on page load
  document.addEventListener("DOMContentLoaded", () => {
    const container = document.querySelector(".fade-container");
    container.classList.add("fade-in");

    // Fade out on link click
    document.querySelectorAll("a[href]").forEach(link => {
      link.addEventListener("click", e => {
        const url = link.getAttribute("href");

        // Ignore external links
        if (url.startsWith("http")) return;

        e.preventDefault();
        container.classList.add("fade-out");

        setTimeout(() => {
          window.location = url;
        }, 500); // match CSS transition
      });
    });
  });
</script>

<script>
window.addEventListener("pageshow", (event) => {
  if (event.persisted) {
    const container = document.querySelector(".fade-container");
    container.classList.remove("fade-out");
    container.classList.add("fade-in");
  }
});
</script>
<script type="text/javascript">
  function googleTranslateElementInit() {
    new google.translate.TranslateElement({
      pageLanguage: 'en',
      includedLanguages: 'en,es,ca',
      layout: google.translate.TranslateElement.InlineLayout.SIMPLE
    }, 'google_translate_element');
  }

// Wait for DOM + Google Translate
document.addEventListener('DOMContentLoaded', function() {
  function googleTranslateElementInit() {
    new google.translate.TranslateElement({
      pageLanguage: 'en',
      includedLanguages: 'en,es,ca',
      layout: google.translate.TranslateElement.InlineLayout.SIMPLE
    }, 'google_translate_element');
  }

  // Load Google Translate FIRST
  const script = document.createElement('script');
  script.src = '//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
  document.head.appendChild(script);

  // After 2 seconds - setup toggle
  setTimeout(() => {
    // Hide Google dropdown
    const combo = document.querySelector('.goog-te-combo');
    if (combo) combo.style.display = 'none';

    // Show + activate YOUR button
    const toggle = document.getElementById('langToggle');
    const label = document.getElementById('langLabel');
    
    if (!toggle || !label) return; // Safety check
    
    toggle.style.display = 'flex';
    
    let currentLang = localStorage.getItem('preferredLanguage') || 'en';
    
    function changeLanguage(lang) {
      currentLang = lang;
      label.textContent = lang === 'en' ? 'EN' : lang === 'es' ? 'ES' : 'CA';
      localStorage.setItem('preferredLanguage', lang);
      
      const select = document.querySelector('.goog-te-combo');
      if (select) {
        select.value = lang;
        select.dispatchEvent(new Event('change', {bubbles: true}));
      }
    }
    
    // Set initial language
    changeLanguage(currentLang);
    
    // **CLICK WORKS 100%**
    toggle.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      const languages = ['en', 'es', 'ca'];
      const currentIndex = languages.indexOf(currentLang);
      const nextLang = languages[(currentIndex + 1) % 3];
      changeLanguage(nextLang);
    });
  }, 2000);
});
</script>
