<script>
document.querySelectorAll('.project').forEach(project => {
  project.addEventListener('click', function(e) {
    e.preventDefault();  // stop instant navigation

    const url = this.getAttribute("href");
    const rect = this.getBoundingClientRect();
    const ripple = document.createElement("span");

    const size = Math.max(rect.width, rect.height) * 1.6;
    ripple.style.width = ripple.style.height = size + "px";

    const x = e.clientX - rect.left - size / 2;
    const y = e.clientY - rect.top - size / 2;

    ripple.style.left = x + "px";
    ripple.style.top = y + "px";

    ripple.classList.add("ripple");
    this.appendChild(ripple);

    requestAnimationFrame(() => {
      ripple.classList.add("active");
    });

    // ⏳ wait for elegant animation, THEN change page
    setTimeout(() => {
      window.location = url;
    }, 650); // adjust to match your ripple duration
  });
});
</script>

<script>
  // Fade in on page load
  document.addEventListener("DOMContentLoaded", () => {
    const container = document.querySelector(".fade-container");
    container.classList.add("fade-in");

    // Fade out on link click
    document.querySelectorAll("a[href]").forEach(link => {
      link.addEventListener("click", e => {
        const url = link.getAttribute("href");

        // Ignore external links
        if (url.startsWith("http")) return;

        e.preventDefault();
        container.classList.add("fade-out");

        setTimeout(() => {
          window.location = url;
        }, 500); // match CSS transition
      });
    });
  });
</script>

<script>
function triggerHtmlEvent(element, eventName) {
  var event;
  if (document.createEvent) {
    event = document.createEvent('HTMLEvents');
    event.initEvent(eventName, true, true);
    element.dispatchEvent(event);
  } else {
    event = document.createEventObject();
    event.eventType = eventName;
    element.fireEvent('on' + event.eventType, event);
  }
}

function initLanguagePersistence() {
  const lang = localStorage.getItem("preferredLanguage");
  if (!lang || lang === "en") return;

  const interval = setInterval(() => {
    const select = document.querySelector(".goog-te-combo");
    if (select && select.value !== lang) {
      select.value = lang;
      triggerHtmlEvent(select, "change");
      clearInterval(interval);
    }
  }, 100);
}

function saveLanguageChoice() {
  const observer = new MutationObserver(() => {
    const select = document.querySelector(".goog-te-combo");
    if (select && !select.dataset.listenerAdded) {
      select.dataset.listenerAdded = "true";
      select.addEventListener("change", () => {
        const newLang = select.value;
        if (newLang !== "en") {
          localStorage.setItem("preferredLanguage", newLang);
        } else {
          localStorage.removeItem("preferredLanguage");
        }
      });
    }
  });
  observer.observe(document.body, { childList: true, subtree: true });
}

// Run on every page load
if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", () => {
    initLanguagePersistence();
    saveLanguageChoice();
  });
} else {
  initLanguagePersistence();
  saveLanguageChoice();
}
</script>
