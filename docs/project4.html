  <h1 class="hover-green" style="margin:0;">Tectonic Garden</h1>


  <h3 style="font-size: 15px; color:#555; margin:0;">McGregor Coxall Studio</h3>
  <p style="font-size: 15px"
  data-en="One hundred years after the 1927 Parlor Gardens exhibition, TECTONIC Garden reinterprets the dialogue between nature and the built environment for our post-industrial age. Where Rubió i Tudurí, Dufy, and Artigas created miniature sanctuaries that brought the garden into domestic space, this work invites reflection on how cities themselves have become a new form of nature—brutal, elemental, and perpetually transforming. The installation comprises nine ceramic flutes rising from a circular base, their industrial forms echoing the cooling towers, smokestacks, and infrastructural monuments that define our urban horizons. These structures, once symbols of fossil fuel dependency and private industrial power, stand reimagined as vessels for ecological renewal."
  data-es="Cien años después de la exposición Jardines de Salón de 1927, TECTONIC Garden reinterpreta el diálogo entre la naturaleza y el entorno construido para nuestra era posindustrial. Allí donde Rubió i Tudurí, Dufy y Artigas crearon santuarios en miniatura que llevaban el jardín al espacio doméstico, esta obra invita a reflexionar sobre cómo las propias ciudades se han convertido en una nueva forma de naturaleza: brutal, elemental y en transformación perpetua. La instalación comprende nueve tubos cerámicos que se elevan desde una base circular; sus formas industriales evocan las torres de refrigeración, las chimeneas y los monumentos infraestructurales que definen nuestros horizontes urbanos. Estas estructuras, que un día fueron símbolos de la dependencia de los combustibles fósiles y del poder industrial privado, se reimaginan como recipientes para la renovación ecológica."
  data-ca="Cent anys després de l’exposició Jardins de Saló de 1927, TECTONIC Garden reinterpreta el diàleg entre la natura i l’entorn construït en la nostra era postindustrial. Allà on Rubió i Tudurí, Dufy i Artigas van crear santuaris en miniatura que portaven el jardí a l’espai domèstic, aquesta obra convida a reflexionar sobre com les ciutats mateixes han esdevingut una nova forma de natura: brutal, elemental i en transformació perpètua. La instal·lació està composta per nou flautes ceràmiques que s’eleven des d’una base circular; les seves formes industrials evoquen les torres de refrigeració, les xemeneies i els monuments infraestructurals que defineixen els nostres horitzons urbans. Aquestes estructures, abans símbols de la dependència dels combustibles fòssils i del poder industrial privat, es reimaginen com a recipients per a la renovació ecològica.">
</p>

<p style="font-size: 15px"
  data-en="In this transformation lies the work's central proposition: that the tectonic landscapes of decline—vacant lots, abandoned infrastructure and post-industrial sites—are not voids but fertile ground for cultural and ecological rebirth. Drawing from principles of Biourbanism, TECTONIC Garden positions the city not as nature's opposition but as its contemporary expression."
  data-es="En esta transformación reside la propuesta central de la obra: que los paisajes tectónicos del declive —solares vacíos, infraestructuras abandonadas y lugares posindustriales— no son vacíos, sino terreno fértil para el renacimiento cultural y ecológico. Basándose en los principios del biourbanismo, TECTONIC Garden sitúa la ciudad no como oposición de la naturaleza, sino como su expresión contemporánea."
  data-ca="En aquesta transformació rau la proposta central de l’obra: que els paisatges tectònics del declivi —solars buits, infraestructures abandonades i espais postindustrials— no són buits, sinó terreny fèrtil per al renaixement cultural i ecològic. Partint dels principis del biourbanisme, TECTONIC Garden situa la ciutat no com l’antagònic de la natura, sinó com la seva expressió contemporània.">
</p>

<p style="font-size: 15px"
  data-en="Just as natural ecosystems undergo succession, urban areas decline and renew in response to shifting technological, industrial, and social forces. The brutalist beauty of sameness and function becomes a canvas for ecological imagination. Each flute is filled with water and crowned monthly with a carefully selected flower species, their stigma and stamens—those essential organs of reproduction and life—reaching upward from industrial forms. This curatorial act acknowledges the gardener's vital role in shaping urban nature. As flowers bloom and fade, the cycle of life and death becomes visible, integrated into the work's aesthetic experience. The gardener replaces spent blooms, maintaining the garden while allowing natural processes to unfold."
  data-es="Del mismo modo que los ecosistemas naturales pasan por procesos de sucesión, las áreas urbanas declinan y se renuevan en respuesta a fuerzas tecnológicas, industriales y sociales cambiantes. La belleza brutalista de la repetición y la función se convierte en un lienzo para la imaginación ecológica. Cada tubo se llena de agua y se corona mensualmente con una especie floral cuidadosamente seleccionada; sus estigmas y estambres —esos órganos esenciales de reproducción y vida— se alzan desde formas industriales. Este acto curatorial reconoce el papel vital del jardinero en la configuración de la naturaleza urbana. A medida que las flores florecen y se marchitan, el ciclo de vida y muerte se hace visible, integrado en la experiencia estética de la obra. El jardinero sustituye las flores marchitas, manteniendo el jardín mientras permite que los procesos naturales se desplieguen."
  data-ca="Així com els ecosistemes naturals passen per processos de successió, les àrees urbanes decauen i es renoven en resposta a forces tecnològiques, industrials i socials canviants. La bellesa brutalista de la repetició i la funció esdevé un llenç per a la imaginació ecològica. Cada flauta s’omple d’aigua i es corona mensualment amb una espècie floral acuradament seleccionada; l’estigma i els estams —aquests òrgans essencials de reproducció i vida— s’eleven des de les formes industrials. Aquest acte curatorial reconeix el paper vital del jardiner en la configuració de la natura urbana. A mesura que les flors floreixen i es marceixen, el cicle de la vida i la mort es fa visible, integrat en l’experiència estètica de l’obra. El jardiner substitueix les flors pansides, manté el jardí i permet que els processos naturals es despleguin.">
</p>

<p style="font-size: 15px"
  data-en="The circular base, layered with moss, represents how ecological systems quietly colonize disused spaces, transforming concrete and steel into living substrates. This ground-level transformation mirrors larger movements toward adaptive reuse, the conversion of private infrastructure into public parks, cultural facilities, and community resources. In the exhibition's final month, the gardener gains full creative license, selecting any combination of species for the nine flutes."
  data-es="La base circular, cubierta de musgo, representa cómo los sistemas ecológicos colonizan silenciosamente los espacios en desuso, transformando el hormigón y el acero en sustratos vivos. Esta transformación a nivel del suelo refleja movimientos más amplios hacia la reutilización adaptativa: la conversión de infraestructuras privadas en parques públicos, equipamientos culturales y recursos comunitarios. Durante el último mes de la exposición, el jardinero obtiene plena licencia creativa y selecciona cualquier combinación de especies para los nueve tubos."
  data-ca="La base circular, coberta de capes de molsa, representa com els sistemes ecològics colonitzen silenciosament els espais en desús, transformant el formigó i l’acer en substrats vius. Aquesta transformació arran de terra reflecteix moviments més amplis cap a la reutilització adaptativa, la conversió d’infraestructures privades en parcs públics, equipaments culturals i recursos comunitaris. Durant l’últim mes de l’exposició, el jardiner obté plena llibertat creativa i selecciona qualsevol combinació d’espècies per a les nou flautes.">
</p>

<p style="font-size: 15px"
  data-en="This gesture dissolves the boundary between designer and caretaker, acknowledging that both roles are essential to the garden's existence. The work becomes a collaboration across time, between the original vision, monthly curatorial decisions, and nature's own unpredictable vitality. TECTONIC Garden thus completes a circle begun a century ago: from the Parlor Garden that brought nature into the home, to the contemporary recognition that our cities, in all their brutalist grandeur and industrial decay, have become landscapes where nature and culture continuously remake one another. McGregor / Coxall Studio"
  data-es="Este gesto disuelve la frontera entre diseñador y cuidador, reconociendo que ambos roles son esenciales para la existencia del jardín. La obra se convierte en una colaboración a través del tiempo, entre la visión original, las decisiones curatoriales mensuales y la vitalidad imprevisible de la naturaleza. TECTONIC Garden completa así un círculo iniciado hace un siglo: del Jardín de Salón que llevó la naturaleza al hogar, al reconocimiento contemporáneo de que nuestras ciudades, en toda su grandeza brutalista y decadencia industrial, se han convertido en paisajes donde naturaleza y cultura se rehacen continuamente una a la otra. McGregor / Coxall Studio"
  data-ca="Aquest gest dissol la frontera entre dissenyador i cuidador, reconeixent que tots dos rols són essencials per a l’existència del jardí. L’obra es converteix en una col·laboració al llarg del temps, entre la visió original, les decisions curatorials mensuals i la vitalitat imprevisible de la natura. TECTONIC Garden completa així un cercle iniciat fa un segle: del Jardí de Saló que portava la natura a la llar al reconeixement contemporani que les nostres ciutats, amb tota la seva grandesa brutalista i el seu declivi industrial, s’han convertit en paisatges on natura i cultura es refan contínuament l’una a l’altra. McGregor / Coxall Studio">
</p>

<script>
const track = document.querySelector('.smooth-slider-track');
const leftBtn = document.querySelector('.slider-arrow.left');
const rightBtn = document.querySelector('.slider-arrow.right');

let x = 0;                 // current horizontal position
let speed = 0.5;           // auto-scroll speed
let paused = false;
let resumeTimer;

// AUTO SCROLL LOOP
function autoScroll() {
  if (!paused) {
    x -= speed;
    track.style.transform = `translateX(${x}px)`;

    // LOOPING LOGIC
    const halfWidth = track.scrollWidth / 2;
    if (Math.abs(x) >= halfWidth) {
      x = 0; // reset to start
      track.style.transform = `translateX(0)`;
    }
  }

  requestAnimationFrame(autoScroll);
}
autoScroll();

// PAUSE AUTO SCROLL
function pauseAuto() {
  paused = true;
  clearTimeout(resumeTimer);
  resumeTimer = setTimeout(() => {
    paused = false;
  }, 2000);
}

// BUTTON: MOVE LEFT
leftBtn.addEventListener('click', () => {
  pauseAuto();
  x += 200;
  track.style.transform = `translateX(${x}px)`;
});

// BUTTON: MOVE RIGHT
rightBtn.addEventListener('click', () => {
  pauseAuto();
  x -= 200;
  track.style.transform = `translateX(${x}px)`;
});
</script>

<script>
  // Fade in on page load
  document.addEventListener("DOMContentLoaded", () => {
    const container = document.querySelector(".fade-container");
    container.classList.add("fade-in");

    // Fade out on link click
    document.querySelectorAll("a[href]").forEach(link => {
      link.addEventListener("click", e => {
        const url = link.getAttribute("href");

        // Ignore external links
        if (url.startsWith("http")) return;

        e.preventDefault();
        container.classList.add("fade-out");

        setTimeout(() => {
          window.location = url;
        }, 500); // match CSS transition
      });
    });
  });
</script>
<script>
window.addEventListener("pageshow", (event) => {
  if (event.persisted) {
    const container = document.querySelector(".fade-container");
    container.classList.remove("fade-out");
    container.classList.add("fade-in");
  }
});
</script>
<script>

  );
});
</script>
<script>
function applyLang(lang) {
  document.querySelectorAll("[data-en]").forEach(el => {
    const value = el.getAttribute(`data-${lang}`);
    if (value) {
      el.innerHTML = value;
    }
  });
}

function setLang(lang) {
  applyLang(lang);
  localStorage.setItem("lang", lang);
}

window.addEventListener("DOMContentLoaded", () => {
  const savedLang = localStorage.getItem("lang");

  // ALWAYS default to English first
  applyLang("en");

  // then override if user previously chose something else
  if (savedLang && savedLang !== "en") {
    applyLang(savedLang);
  }
});
</script>
