    /* === MINIMALIST WHITE YELLOW === */
    .wt-page {
      --yellow: #FBF80B;
      --yellow-glow: rgba(251, 248, 11, 0.3);
      --text-dark: #ffffff;
      --text-light: #fff;
      --bg: #fff;
      --glass-border: rgba(200, 200, 200, 0.3);
      --transition: all 0.5s cubic-bezier(0.2, 0.8, 0.4, 1);
    }
    .wt-page .nav-menutwo.open-two {
      right: 0;
    }
    /* Base Reset */
    .wt-page {
      margin: 0;
      padding: 0;
      font-family: 'Monogeist', sans-serif;
      background: var(--bg);
      color: var(--text-dark);
      overflow-x: hidden;
    }

    .wt-page .fade-container {
      opacity: 0;
      transition: opacity 1s var(--transition);
    }
    .wt-page .fade-container.fade-in {
      opacity: 1;
    }
    .wt-page .fade-container.fade-out {
      opacity: 0;
    }
    
    /* Navbar */
    .wt-page .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background: #fff;
      border-bottom: 1px solid var(--glass-border);
    }
    .wt-page .logo-image {
      height: 72px;
      filter: drop-shadow(0 0 6px var(--yellow-glow));
    }
    .wt-page .lang-switch button {
      background: transparent;
      border: 1px solid var(--yellow);
      color: var(--yellow);
      padding: 0.4rem 0.8rem;
      margin: 0 0.2rem;
      border-radius: 16px;
      cursor: pointer;
      transition: var(--transition);
      font-size: 0.85rem;
    }
    .wt-page .lang-switch button:hover {
      background: var(--yellow);
      color: var(--text-dark);
      box-shadow: 0 0 12px var(--yellow-glow);
    }
    .wt-page .instagram-icon {
      height: 32px;
    }
/* Hamburger */
.wt-page .hamburgertwo {
  position: relative;
  cursor: pointer;
  font-size: 32px;
  user-select: none;
  z-index: 9999;
  margin-right: 14px;
  margin-top: 4px;
  transition: opacity .3s ease;
  color: #FBF80B;          /* yellow */
}

.wt-page .hamburgertwo.active {
    opacity: 0;
    pointer-events: none;
}

/* Menu */
.wt-page .nav-menutwo {
  position: absolute;
  top: 48px;
  right: 20px;

  background: white;
  padding: 22px;
  width: 240px;

  border-radius: 14px;
  box-shadow: 0 12px 35px rgba(0,0,0,.18);

  display: flex;
  flex-direction: column;
  gap: 18px;

  opacity: 0;
  transform: translateY(-12px);
  pointer-events: none;

  transition: opacity .35s ease, transform .35s ease;
  z-index: 9998;
}

.wt-page .nav-menutwo.open-two {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

.wt-page .nav-menutwo a {
  text-decoration: none;
  color: rgb(44, 43, 43);
  font-size: 18px;
  transition: .25s;
}

.wt-page .nav-menutwo a:hover {
  color: #FBF80B;   /* yellow hover */
  transform: translateX(3px);
}
.fade-container {
  opacity: 0;
  transition: opacity 0.6s ease;
}

.fade-container.fade-in {
  opacity: 1;
}

.fade-container.fade-out {
  opacity: 0;
}

    .wt-page .nav-menutwo a:hover {

      margin: 0;
      color: var(--yellow);
      letter-spacing: -1px;
      animation: shimmer 3s infinite alternate;

    @keyframes shimmer {

      100% { filter: drop-shadow(0 0 12px var(--yellow-glow)); }
    }
    .wt-page h3 {
      font-size: clamp(1rem, 2.5vw, 1.3rem);
      color: #888;
      margin: 0.5rem 0 3rem;
      font-weight: 400;
    }

    /* WT Wrapper */
    .wt-page .wt-wrapper {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      margin-top: 1rem;
    }
    .wt-page .wt-column {
      position: relative;
    }
    .wt-page .wt-title {
      font-size: clamp(1.8rem, 4vw, 2.2rem);
      color: var(--yellow);
      margin-bottom: 1.5rem;
      text-shadow: 0 0 8px var(--yellow-glow);

    .wt-page .wt-stack {
      display: grid;

    }
    .wt-page .tilt-img {
      width: 100%;
      border-radius: 12px;
      object-fit: cover;
      aspect-ratio: 4/3;
      transition: var(--transition);
      box-shadow: 0 4px 12px rgb(255, 255, 255);
      cursor: pointer;
      background: #fafafa;

    .wt-page .tilt-img:hover {
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 12px 30px rgb(251, 247, 11);
      z-index: 10;
    }

    /* Responsive */
    @media (max-width: 900px) {

}

  <!-- Scripts -->
  <script>
    const lenis = new Lenis({
      duration: 1.2,
      easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
      smooth: true
    });
    function raf(time) {
      lenis.raf(time);
      requestAnimationFrame(raf);
    }
    requestAnimationFrame(raf);
  </script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const container = document.querySelector(".fade-container");
      container.classList.add("fade-in");
      document.querySelectorAll("a[href]").forEach(link => {
        link.addEventListener("click", e => {
          const url = link.getAttribute("href");
          if (url.startsWith("http")) return;
          e.preventDefault();
          container.classList.add("fade-out");
          setTimeout(() => { window.location = url; }, 500);
        });
      });
    });
  </script>
  <script>
    window.addEventListener("pageshow", (event) => {
      if (event.persisted) {
        const container = document.querySelector(".fade-container");
        container.classList.remove("fade-out");
        container.classList.add("fade-in");
      }
    });
  </script>
  <script>
    function applyLang(lang) {
      document.querySelectorAll("[data-en]").forEach(el => {
        const value = el.getAttribute(`data-${lang}`);
        if (value) { el.innerHTML = value; }
      });
    }
    function setLang(lang) {
      applyLang(lang);
      localStorage.setItem("lang", lang);
    }
    window.addEventListener("DOMContentLoaded", () => {
      const savedLang = localStorage.getItem("lang");
      applyLang("en");
      if (savedLang && savedLang !== "en") { applyLang(savedLang); }
    });
  </script>
  <script>
    document.querySelectorAll('.tilt-img').forEach(img => {
      img.addEventListener('mousemove', (e) => {
        const rect = img.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        const rotateY = ((x - centerX) / centerX) * 57;
        const rotateX = ((y - centerY) / centerY) * -57;
        img.style.transform = `perspective(1000px) rotateY(${rotateY}deg) rotateX(${rotateX}deg) scale(1.02)`;
      });
      img.addEventListener('mouseleave', () => {
        img.style.transform = 'perspective(1000px) rotateY(0) rotateX(0) scale(1)';
      });
    });
  const burger = document.getElementById("hamburgertwo");
const menu = document.getElementById("nav-menutwo");

burger.addEventListener("click", (e) => {
    e.stopPropagation();

    burger.classList.toggle("active");
    menu.classList.toggle("open-two");
});

document.addEventListener("click", (e) => {
    if (!menu.contains(e.target) && !burger.contains(e.target)) {
        menu.classList.remove("open-two");
        burger.classList.remove("active");
    }
});
  </script>
