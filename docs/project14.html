<script>
const track = document.querySelector('.smooth-slider-track');
const leftBtn = document.querySelector('.slider-arrow.left');
const rightBtn = document.querySelector('.slider-arrow.right');

let x = 0;                 // current horizontal position
let speed = 0.5;           // auto-scroll speed
let paused = false;
let resumeTimer;

// AUTO SCROLL LOOP
function autoScroll() {
  if (!paused) {
    x -= speed;
    track.style.transform = `translateX(${x}px)`;

    // LOOPING LOGIC
    const halfWidth = track.scrollWidth / 2;
    if (Math.abs(x) >= halfWidth) {
      x = 0; // reset to start
      track.style.transform = `translateX(0)`;
    }
  }

  requestAnimationFrame(autoScroll);
}
autoScroll();

// PAUSE AUTO SCROLL
function pauseAuto() {
  paused = true;
  clearTimeout(resumeTimer);
  resumeTimer = setTimeout(() => {
    paused = false;
  }, 2000);
}

// BUTTON: MOVE LEFT
leftBtn.addEventListener('click', () => {
  pauseAuto();
  x += 200;
  track.style.transform = `translateX(${x}px)`;
});

// BUTTON: MOVE RIGHT
rightBtn.addEventListener('click', () => {
  pauseAuto();
  x -= 200;
  track.style.transform = `translateX(${x}px)`;
});
</script>

<script>
  // Fade in on page load
  document.addEventListener("DOMContentLoaded", () => {
    const container = document.querySelector(".fade-container");
    container.classList.add("fade-in");

    // Fade out on link click
    document.querySelectorAll("a[href]").forEach(link => {
      link.addEventListener("click", e => {
        const url = link.getAttribute("href");

        // Ignore external links
        if (url.startsWith("http")) return;

        e.preventDefault();
        container.classList.add("fade-out");

        setTimeout(() => {
          window.location = url;
        }, 500); // match CSS transition
      });
    });
  });
</script>
<script>
window.addEventListener("pageshow", (event) => {
  if (event.persisted) {
    const container = document.querySelector(".fade-container");
    container.classList.remove("fade-out");
    container.classList.add("fade-in");
  }
});
</script>
<script>
window.addEventListener("scroll", () => {
  document.documentElement.style.setProperty(
    "--scroll-offset",
    `${window.scrollY * -1.95}px`
  );
});
</script>
<script>
function applyLang(lang) {
  document.querySelectorAll("[data-en]").forEach(el => {
    const value = el.getAttribute(`data-${lang}`);
    if (value) {
      el.innerHTML = value;
    }
  });
}

function setLang(lang) {
  applyLang(lang);
  localStorage.setItem("lang", lang);
}

window.addEventListener("DOMContentLoaded", () => {
  const savedLang = localStorage.getItem("lang");

  // ALWAYS default to English first
  applyLang("en");

  // then override if user previously chose something else
  if (savedLang && savedLang !== "en") {
    applyLang(savedLang);
  }
});
</script>
