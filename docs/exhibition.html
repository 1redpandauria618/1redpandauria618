<h3 style="font-size: 15px; color:#555; margin:0;"
data-en="Dreams from the Rooftop · Barcelona Botanical Garden · June – September 2026"
data-es="Sueños desde la azotea · Jardín Botánico de Barcelona · junio – septiembre de 2026"
data-ca="Somnis des del terrat · Jardí Botànic de Barcelona · juny – setembre de 2026"></h3>
<p style="font-size: 15px"
data-en="Barcelona has been designated UNESCO–UIA World Capital of Architecture for 2026 — the first city to hold this title in the congress's modern form. The designation is both recognition and responsibility: an invitation to make the case, before an international professional audience, that architecture is not a specialist concern but a shared civic language. That space is political. That design is democracy made material."
data-es="Barcelona ha sido designada Capital Mundial de la Arquitectura UNESCO–UIA para 2026 — la primera ciudad que acoge el congreso en su formato moderno. La designación es a la vez reconocimiento y responsabilidad: una invitación a demostrar, ante un público profesional internacional, que la arquitectura no es una cuestión para especialistas, sino un lenguaje cívico compartido. Que el espacio es político. Que el diseño es democracia materializada."
data-ca="Barcelona ha estat designada Capital Mundial de l’Arquitectura UNESCO–UIA 2026 — la primera ciutat que acull el congrés en el seu format modern. La designació és alhora reconeixement i responsabilitat: una invitació a demostrar, davant d’un públic professional internacional, que l’arquitectura no és només una disciplina per a especialistes, sinó un llenguatge cívic compartit. Que l’espai és polític. Que el disseny és democràcia materialitzada.">
</p>

<p style="font-size: 15px"
data-en="Selected through an open call and fully funded by the Barcelona City Council, Parlour Gardens: Dreams from the Rooftop serves as a core component of the UNESCO–UIA World Capital of Architecture 2026 official programme. This exhibition is designed to fit within a city-wide framework focused on architectural quality, the transformation of urban models, and the strengthening of the local architecture ecosystem."
data-es="Seleccionada mediante convocatoria abierta y financiada íntegramente por el Ayuntamiento de Barcelona, Jardines de Salón: sueños desde la azotea es un componente central del programa oficial de la Capital Mundial de la Arquitectura UNESCO–UIA 2026. La exposición se desarrolla dentro de un marco urbano centrado en la calidad arquitectónica, la transformación de los modelos urbanos y el fortalecimiento del ecosistema arquitectónico local."
data-ca="Seleccionada mitjançant convocatòria oberta i finançada íntegrament per l’Ajuntament de Barcelona, Jardins de Saló: somnis des del terrat forma part del programa oficial de la Capital Mundial de l’Arquitectura UNESCO–UIA 2026. L’exposició s’inscriu en un marc urbà centrat en la qualitat arquitectònica, la transformació dels models urbans i l’enfortiment de l’ecosistema arquitectònic local.">
</p>

<p style="font-size: 15px"
data-en="Hosted at the Barcelona Botanical Garden from June to September 2026, the project creates a unique multidisciplinary intersection by integrating art, technology, architecture, and landscape design. It bridges a century of innovation — pairing a historic 1927 ceramic model with contemporary visions produced thanks to the latest ceramic 3D printing techniques and living vegetation — to redefine the urban rooftop as a vital space of ecological and social possibility."
data-es="Celebrada en el Jardín Botánico de Barcelona de junio a septiembre de 2026, la muestra crea una intersección multidisciplinar única al integrar arte, tecnología, arquitectura y paisaje. Tiende un puente sobre un siglo de innovación —combinando un modelo cerámico histórico de 1927 con visiones contemporáneas producidas mediante impresión cerámica 3D y vegetación viva— para redefinir la azotea urbana como un espacio de posibilidad ecológica y social."
data-ca="Celebrada al Jardí Botànic de Barcelona de juny a setembre de 2026, la mostra crea una intersecció multidisciplinària única en integrar art, tecnologia, arquitectura i paisatge. Estén un pont sobre un segle d’innovació —combinant una maqueta ceràmica històrica de 1927 amb visions contemporànies produïdes amb impressió ceràmica 3D i vegetació viva— per redefinir el terrat urbà com un espai de possibilitat ecològica i social.">
</p>

<p style="font-size: 15px"
data-en="The exhibition finds its home in a venue that is itself a triumph of ecological transformation: the Barcelona Botanical Garden. Designed by architects Carlos Ferrater and Josep Lluís Canosa alongside landscape architect Beth Figueras for the 1992 Olympics, this 14-hectare site on Montjuïc was reclaimed from a former landfill to become a world-class ecological showcase. Its unique triangular mesh structure fractalizes the Mediterranean landscape, organizing flora into specific homoclimatic zones: California, Chile, South Africa, Australia, and the Mediterranean."
data-es="La exposición se celebra en un espacio que es en sí mismo un triunfo de la transformación ecológica: el Jardín Botánico de Barcelona. Diseñado por los arquitectos Carlos Ferrater y Josep Lluís Canosa junto con la paisajista Beth Figueras para los Juegos Olímpicos de 1992, este recinto de 14 hectáreas en Montjuïc fue recuperado de un antiguo vertedero para convertirse en un escaparate ecológico de referencia mundial. Su estructura de malla triangular fractaliza el paisaje mediterráneo, organizando la flora en zonas homoclimáticas: California, Chile, Sudáfrica, Australia y el Mediterráneo."
data-ca="L’exposició té lloc en un espai que és en si mateix un triomf de la transformació ecològica: el Jardí Botànic de Barcelona. Dissenyat pels arquitectes Carlos Ferrater i Josep Lluís Canosa juntament amb la paisatgista Beth Figueras per als Jocs Olímpics de 1992, aquest recinte de 14 hectàrees a Montjuïc va ser recuperat d’un antic abocador per convertir-se en un aparador ecològic de referència mundial. La seva estructura de malla triangular fractalitza el paisatge mediterrani, organitzant la flora en zones homoclimàtiques: Califòrnia, Xile, Sud-àfrica, Austràlia i el Mediterrani.">
</p>

<script>
  // Fade in on page load
  document.addEventListener("DOMContentLoaded", () => {
    const container = document.querySelector(".fade-container");
    container.classList.add("fade-in");

    // Fade out on link click
    document.querySelectorAll("a[href]").forEach(link => {
      link.addEventListener("click", e => {
        const url = link.getAttribute("href");

        // Ignore external links
        if (url.startsWith("http")) return;

        e.preventDefault();
        container.classList.add("fade-out");

        setTimeout(() => {
          window.location = url;
        }, 500); // match CSS transition
      });
    });
  });
</script>

<script>
const hotspots = document.querySelectorAll('.hotspot');
const infoBox = document.getElementById('map-info');

hotspots.forEach(h => {
  h.addEventListener('mouseenter', () => {
    infoBox.style.opacity = 0;
    setTimeout(() => {
      infoBox.textContent = h.dataset.text;
      infoBox.style.opacity = 1;
    }, 150);
  });
});
</script>
<script>
window.addEventListener("pageshow", (event) => {
  if (event.persisted) {
    const container = document.querySelector(".fade-container");
    container.classList.remove("fade-out");
    container.classList.add("fade-in");
  }
});
</script>
<script>
function applyLang(lang) {
  document.querySelectorAll("[data-en]").forEach(el => {
    const value = el.getAttribute(`data-${lang}`);
    if (value) {
      el.innerHTML = value;
    }
  });
}

function setLang(lang) {
  applyLang(lang);
  localStorage.setItem("lang", lang);
}

window.addEventListener("DOMContentLoaded", () => {
  const savedLang = localStorage.getItem("lang");

  // ALWAYS default to English first
  applyLang("en");

  // then override if user previously chose something else
  if (savedLang && savedLang !== "en") {
    applyLang(savedLang);
  }
});
</script>
